name: Pipeline CI/CD - Catálogo de Jogos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissões necessárias para fazer o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ------------------------------------
  # Etapa 1: Integração Contínua (CI)
  # ------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Lint (validação)
        run: npm run lint

      - name: Rodar Testes
        run: npm run test

      - name: Build do projeto
        run: npm run build
        env:
          VITE_RAWG_API_KEY: ${{ secrets.VITE_RAWG_API_KEY }}

      - name: Upload do artefato para Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ------------------------------------
  # Etapa 2: Entrega Contínua (CD)
  # ------------------------------------
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4